# Development, layered over compose.yml: `COMPOSE_FILE=compose.yml:compose.dev.yml`
# in .env is what loads it (env.dev ships the line), so every command afterwards
# is the plain `docker compose ...`.
#
# The application runs the dev server from the bind-mounted sources, with its
# modules in a named volume, and is where every development command is typed —
# the schema push, the tests and the scripts — so it also gets the owner's
# connection, which the served application never does.
services:
  db:
    restart: "no"

  s3:
    restart: "no"

  app:
    build:
      target: dev
    environment:
      NODE_ENV: development
      HUMANDBS_OWNER_DATABASE_URL: ${HUMANDBS_OWNER_DATABASE_URL}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # The dev server compiles on the first request, which the check would time.
    healthcheck:
      disable: true
    restart: "no"

  # The image carries its sources; these are mounted over them so that an edit
  # is picked up by restarting the container rather than rebuilding it.
  assistant-api:
    volumes:
      - ./assistant-api/src:/app/src
      - ./assistant-api/templates:/app/templates
      - ./assistant-api/data:/app/data
      - ./assistant-api/tests:/app/tests
    restart: "no"

  # The stock image with the configuration mounted: the dev server answers the
  # assets itself, and an edit to the configuration needs only a restart.
  proxy:
    image: docker.io/library/nginx:1.29-alpine
    build: !reset null
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: "no"

  # The end-to-end tests, which drive a browser against a running instance.
  #
  # **Behind a profile because the browser image is far larger than the app's
  # and nothing else needs it**, and because these are not run while developing:
  # `docker compose --profile e2e run --rm e2e`.
  #
  # Its modules are its own rather than the app's — the two images are built on
  # different distributions, and the packages that ship a compiled binary would
  # be the wrong one for whichever container installed second.
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    environment:
      TZ: ${HUMANDBS_TZ:-Asia/Tokyo}
      # Which instance is driven. The proxy in this compose unless told
      # otherwise, so that a scenario can be tried before it is pointed at a
      # deployment.
      HUMANDBS_E2E_BASE_URL: ${HUMANDBS_E2E_BASE_URL:-http://proxy:8080}
      # The session the signed-in scenarios carry, made on that instance with
      # `npm run e2e:session`. Absent, they skip rather than pass
      # (`playwright.config.ts`).
      HUMANDBS_E2E_SESSION: ${HUMANDBS_E2E_SESSION:-}
    volumes:
      - .:/app
      - e2e_modules:/app/node_modules
    command:
      - sh
      - -c
      - test -d node_modules/@playwright/test || npm ci --no-audit --no-fund; npx playwright test
    init: true

volumes:
  node_modules:
  e2e_modules:
