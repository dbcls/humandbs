# The deployment. Every service runs from an image, and nothing of the
# repository is mounted but configuration. Development layers compose.dev.yml
# over this (bind-mounted sources, the dev server, the modules in a volume), and
# a rootless-podman deployment layers compose.deploy.yml over this.
#
# **Kept to what podman-compose 1.0.6 understands**, which is what the
# deployments run: no profiles are relied on to keep a service down (commands
# name their services), `depends_on` is ordering only, a volume a later file
# changes is written here as a map, and a healthcheck is a `CMD-SHELL` string
# (it quotes the list form of `CMD` wrongly).

# The one environment the application and the one-shot tools share. The
# owner's connection is deliberately not in it: only migrate and tools get it.
x-app-environment: &app-environment
  TZ: ${HUMANDBS_TZ:-Asia/Tokyo}
  NODE_ENV: production
  HUMANDBS_DATABASE_URL: ${HUMANDBS_DATABASE_URL}
  HUMANDBS_AUTH_ISSUER_URL: ${HUMANDBS_AUTH_ISSUER_URL}
  HUMANDBS_AUTH_CLIENT_ID: ${HUMANDBS_AUTH_CLIENT_ID}
  HUMANDBS_AUTH_REDIRECT_URI: ${HUMANDBS_AUTH_REDIRECT_URI}
  HUMANDBS_S3_ENDPOINT: ${HUMANDBS_S3_ENDPOINT}
  HUMANDBS_S3_ACCESS_KEY: ${HUMANDBS_S3_ACCESS_KEY}
  HUMANDBS_S3_SECRET_KEY: ${HUMANDBS_S3_SECRET_KEY}
  HUMANDBS_PUBLIC_PORT: ${HUMANDBS_PUBLIC_PORT:-8080}
  # The JGA application system. Absent outside production, where the three
  # sources that read it are skipped rather than failed.
  HUMANDBS_JGA_DATABASE_URL: ${HUMANDBS_JGA_DATABASE_URL:-}
  HUMANDBS_JGA_DB_SCHEMA: ${HUMANDBS_JGA_DB_SCHEMA:-}
  # The assistant, which is reached only from here. Absent unless the
  # service below is up, in which case its screen says so.
  HUMANDBS_ASSISTANT_ORIGIN: ${HUMANDBS_ASSISTANT_ORIGIN:-}

services:
  # Not published. Everything that needs a connection — psql, the schema
  # changes, the tests — runs in a container, and a published port is reached
  # through nat PREROUTING without passing the host's INPUT rules, so one would
  # be open whatever the firewall says.
  db:
    image: docker.io/groonga/pgroonga:4.0.8-debian-18
    environment:
      TZ: ${HUMANDBS_TZ:-Asia/Tokyo}
      POSTGRES_USER: ${HUMANDBS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${HUMANDBS_POSTGRES_PASSWORD:?HUMANDBS_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${HUMANDBS_POSTGRES_DB}
    volumes:
      # Postgres 18 images keep the cluster in a major-version subdirectory, so
      # the mount goes one level above what earlier versions used.
      - pgdata:/var/lib/postgresql
      - ./docker/db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: always
    init: true

  # Master, filer and the S3 API all stay inside the compose network: the filer
  # HTTP endpoint is unauthenticated, and a directly reachable S3 port would be
  # a second way to fetch an object without the proxy's headers.
  s3:
    image: docker.io/chrislusf/seaweedfs:4.40
    # The identities are rendered at start from the two keys in .env, so that
    # what signs every presigned URL is kept where the rest of the credentials
    # are and no deployment signs with a value out of the repository —
    # `/private/` is answered by whatever can reach the site, and an object
    # there is only as private as the key its URL is signed with. The image's
    # own entrypoint is what then runs, because it owns the data directory and
    # drops privileges. **Neither key may contain `|`, `&`, `\` or `"`**, being
    # put into JSON by `sed`.
    entrypoint:
      - /bin/sh
      - -c
      - >
        sed -e "s|@HUMANDBS_S3_ACCESS_KEY@|$$HUMANDBS_S3_ACCESS_KEY|"
        -e "s|@HUMANDBS_S3_SECRET_KEY@|$$HUMANDBS_S3_SECRET_KEY|"
        /etc/seaweedfs/s3.json.template > /etc/seaweedfs/s3.json
        && exec /entrypoint.sh "$$0" "$$@"
    command:
      - server
      - -dir=/data
      - -filer
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
    environment:
      TZ: ${HUMANDBS_TZ:-Asia/Tokyo}
      HUMANDBS_S3_ACCESS_KEY: ${HUMANDBS_S3_ACCESS_KEY:?HUMANDBS_S3_ACCESS_KEY is required}
      HUMANDBS_S3_SECRET_KEY: ${HUMANDBS_S3_SECRET_KEY:?HUMANDBS_S3_SECRET_KEY is required}
    volumes:
      - s3data:/data
      - ./docker/s3/s3.json.template:/etc/seaweedfs/s3.json.template:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: always
    init: true

  # Applies the schema migrations in drizzle/ and then the application role's
  # grants, as the owner. **One-shot, and run by hand before the application is
  # (re)started** — podman-compose 1.0.6 has no `service_completed_successfully`,
  # and a dependency on this would tie the application's lifecycle to a
  # container that has exited. The profile keeps `docker compose up` from
  # starting it.
  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: tools
    environment:
      TZ: ${HUMANDBS_TZ:-Asia/Tokyo}
      HUMANDBS_DATABASE_URL: ${HUMANDBS_DATABASE_URL}
      HUMANDBS_OWNER_DATABASE_URL: ${HUMANDBS_OWNER_DATABASE_URL}
    command: ["npm", "run", "db:migrate"]
    depends_on:
      - db
    init: true

  # The same image for everything else an operator runs once: the admin list,
  # the buckets, the ICD10 import, the data migration and the file carry. It
  # has the owner's connection as well, which the served application does not.
  # `migration/input/` is not in the image (it is kept out of the repository),
  # so it is mounted here.
  tools:
    profiles: ["tools"]
    build:
      context: .
      target: tools
    environment:
      <<: *app-environment
      HUMANDBS_OWNER_DATABASE_URL: ${HUMANDBS_OWNER_DATABASE_URL}
    volumes:
      - ./migration/input:/app/migration/input
    command: ["sh", "-c", "echo 'tools: give a command, e.g. npm run admin:list' >&2; exit 2"]
    depends_on:
      - db
      - s3
    init: true

  app:
    build:
      context: .
      target: runtime
    environment:
      <<: *app-environment
    # `/healthz` answers 503 when the database or the store is unreachable.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    # The application is the only service on both networks, so the assistant
    # reaches it and nothing else.
    networks:
      - default
      - assistant
    # The server closes its listener on SIGTERM but its timers keep the process
    # alive, so the grace period is what ends it; the proxy is stopped first.
    stop_grace_period: 2s
    restart: always
    init: true

  # The application assistant. **Not published, and holding no authorisation of
  # its own** — the portal proxies to it after deciding who may reach it, which
  # is the only way in. A published port would be a second
  # one, so it has none.
  #
  # **On a network of its own with the application**, so that it cannot reach
  # the database, the store or the filer: it fetches pages from the internet on
  # instruction, and whatever it can reach, a crafted document can ask it to.
  #
  # Not started unless named: `docker compose --profile assistant up -d`, or
  # `assistant-api` in the list given to `podman-compose up -d`.
  assistant-api:
    profiles: ["assistant"]
    build:
      context: ./assistant-api
    environment:
      TZ: ${HUMANDBS_TZ:-Asia/Tokyo}
      # Where it reads the portal's own data from. The public API needs no
      # credentials, so this is the one address it is given.
      HUMANDBS_API_ORIGIN: http://app:5173
      # Public origin used in links that people open in a browser.
      HUMANDBS_WEB_ORIGIN: ${HUMANDBS_WEB_ORIGIN:-https://humandbs.dbcls.jp/}
      WORK_DIR: /app/work
      TEMPLATE_DIR: /app/templates
      DATA_DIR: /app/data
      GOOGLE_GENAI_CACHE_DIR: /app/work/.cache/genai
      PLAYWRIGHT_CACHE_DIR: /app/work/.cache/playwright
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-credentials.json
      GOOGLE_CLOUD_PROJECT_ID: ${HUMANDBS_ASSISTANT_GOOGLE_CLOUD_PROJECT_ID:-}
      GOOGLE_GENAI_MODEL: ${HUMANDBS_ASSISTANT_GOOGLE_GENAI_MODEL:-gemini-2.5-flash}
      GOOGLE_GENAI_LOCATION: ${HUMANDBS_ASSISTANT_GOOGLE_GENAI_LOCATION:-asia-northeast1}
      GOOGLE_CLOUD_API_KEY: ${HUMANDBS_ASSISTANT_GOOGLE_CLOUD_API_KEY:-}
      GOOGLE_CSE_ID: ${HUMANDBS_ASSISTANT_GOOGLE_CSE_ID:-}
      DOCUMENT_AI_LOCATION: ${HUMANDBS_ASSISTANT_DOCUMENT_AI_LOCATION:-us}
      DOCUMENT_AI_PROCESSOR_ID: ${HUMANDBS_ASSISTANT_DOCUMENT_AI_PROCESSOR_ID:-}
      DDBJ_SEARCH_API_BASE_URL: ${HUMANDBS_ASSISTANT_DDBJ_SEARCH_API_BASE_URL:-https://ddbj.nig.ac.jp/search/api/entries/jga-dataset/}
      GOOGLE_GENAI_CACHE_ENABLED: ${HUMANDBS_ASSISTANT_GENAI_CACHE_ENABLED:-false}
      PLAYWRIGHT_CACHE_TTL_SECONDS: ${HUMANDBS_ASSISTANT_PLAYWRIGHT_CACHE_TTL_SECONDS:-3600}
      INVESTIGATE_RESEARCHER_HISTORY: ${HUMANDBS_ASSISTANT_INVESTIGATE_RESEARCHER_HISTORY:-false}
      LLM_TEMPERATURE: ${HUMANDBS_ASSISTANT_LLM_TEMPERATURE:-0.2}
    volumes:
      - ./assistant-api/gcp-credentials.json:/app/gcp-credentials.json:ro
      # What it has processed. Kept out of the image and the repository.
      - assistant-work:/app/work
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - assistant
    restart: always
    init: true

  # nginx with its configuration and the client half of the build baked in, so
  # that it answers the static files and the application only renders pages
  # and the API. Built from the same sources as `app`, and replaced with it.
  proxy:
    build:
      context: .
      target: proxy
    environment:
      TZ: ${HUMANDBS_TZ:-Asia/Tokyo}
    ports:
      - "${HUMANDBS_PUBLIC_BIND_HOST:-127.0.0.1}:${HUMANDBS_PUBLIC_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_started
      s3:
        condition: service_started
    restart: always
    init: true

networks:
  default: {}
  # A plain bridge, not an internal one: the assistant calls Google Cloud and
  # fetches pages, so it needs the internet, only not the other services.
  assistant: {}

volumes:
  # Written as empty maps so that compose.deploy.yml can lay a location over
  # them: podman-compose refuses to merge a map into a bare key.
  pgdata: {}
  s3data: {}
  assistant-work: {}
