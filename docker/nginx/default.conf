map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# SeaweedFS guesses Content-Type from the body of objects uploaded without one,
# so a payload containing HTML would render inline on the portal's own origin.
# Anything that is not an image or a PDF is therefore forced to download.
map $upstream_http_content_type $files_disposition {
  default             "attachment";
  "~^image/"          "";
  "~^application/pdf" "";
}

server {
  listen 8080;
  server_name _;

  # /files/{humId}/{name} maps onto the path-style URL of the public bucket
  # (bucket "files", key "{humId}/{name}"), so the request URI passes through
  # unchanged.
  location /files/ {
    proxy_pass http://s3:8333;
    proxy_set_header Host $host;
    proxy_hide_header Content-Disposition;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition $files_disposition always;
  }

  location / {
    proxy_pass http://app:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
