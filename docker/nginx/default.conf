map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# SeaweedFS guesses Content-Type from the body of objects uploaded without one,
# so a payload containing HTML would render inline on the portal's own origin.
# Anything that is not an image or a PDF is therefore forced to download.
#
# **SVG is not an image here.** It is a document that runs its own `<script>`
# when opened directly, and the Content-Type is whatever the uploader said, so
# an SVG shown inline would run on the portal's origin. The first matching
# regex wins, which is why it comes before the image branch.
map $upstream_http_content_type $files_disposition {
  default                "attachment";
  "~*^image/svg"         "attachment";
  "~*^image/"            "";
  "~*^application/pdf"   "";
}

# A private file is only ever saved. A signed download asks the store for
# `attachment` with the file's name (`response-content-disposition`, covered by the
# signature), and that value is kept so the browser saves it under the right name;
# anything else, including no header at all, becomes a bare `attachment`.
map $upstream_http_content_disposition $private_disposition {
  default                   "attachment";
  "~*^attachment(;|$)"      $upstream_http_content_disposition;
}

# A file shown inline is a document on the portal's origin. `sandbox` gives it an
# opaque origin of its own and no script, whatever it turns out to contain. A
# PDF is left out: the browser's PDF viewer refuses to run in a sandboxed
# document, and a PDF is drawn by the viewer rather than by the page.
map $upstream_http_content_type $files_csp {
  default                "sandbox; default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'";
  "~*^application/pdf"   "";
}

# **HSTS is only sent over TLS, and TLS does not end here.** This proxy listens
# on plain HTTP behind the host's TLS terminator, so it can only tell a request
# arrived over HTTPS from the header that terminator forwards. A browser ignores
# the header on a plain-HTTP response anyway; the condition keeps it off
# development, where the site is `http://localhost`.
map $http_x_forwarded_proto $hsts {
  default "";
  https   "max-age=31536000";
}

# A page that chose its own policy keeps it (the shared preview sends
# `no-referrer`); a second header would be merged with it and the last token
# would win.
map $upstream_http_referrer_policy $referrer_policy {
  ""      "strict-origin-when-cross-origin";
  default "";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /srv/client;

  # **Every response the application sends has these.** A location that
  # adds a header of its own drops every one inherited from here (that is how
  # nginx's `add_header` works), so the file locations below repeat the ones
  # they need.
  # What a page of the portal may load. **Inline script and style are allowed**:
  # React Router hydrates from an inline script and the markup has inline
  # styles, so this policy does not stop an injected inline script — the markdown
  # renderer's refusal of raw HTML is what does that. What it adds is a second
  # wall around everything else: no plugin, no `<base>` rewriting, script only
  # from this origin, frames only the contact form, and — the part that matters
  # most — **no page may be framed by another**, so a management action cannot be
  # clicked through a transparent frame. Images may come from any https host
  # because an article may show one.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src https://docs.google.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy $referrer_policy always;
  add_header Strict-Transport-Security $hsts always;

  # **What the portal serves is text, and none of it was being compressed.** The
  # image nginx ships with leaves `gzip` off, so every page went out at its full
  # size — one page of a listing is 271 KB of HTML, most of it the values in the
  # refine pane, and it measures 34 KB compressed.
  #
  # HTML is compressed whatever `gzip_types` holds; everything else the app
  # serves has to be named. `gzip_proxied any` because a request that arrived
  # through another proxy has `Via`, which the default leaves uncompressed.
  # `gzip_vary` so that a cache keyed on the address alone cannot hand a
  # compressed body to a client that never asked for one.
  gzip on;
  # **Level 5 rather than the default 1.** A listing is the largest thing the
  # portal serves, and the extra work buys 17 KB on each one (118 → 101 KB).
  # Past 5 the curve flattens — 9 saves 3 KB more for several times the time.
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  # **`application/x-ndjson` is the bulk streams**, which are the largest thing
  # the API serves and the one thing a reader takes whole rather than a page at
  # a time: every dataset is 5.8 MB of lines and 520 KB compressed.
  gzip_types text/css text/javascript application/javascript application/json
             application/x-ndjson image/svg+xml;

  # /files/{humId}/{name} maps onto the path-style URL of the public bucket
  # (bucket "files", key "{humId}/{name}"), so the request URI passes through
  # unchanged.
  #
  # This is also where an upload into `common/` lands — that prefix is public, so
  # its presigned PUTs are addressed here rather than under /private/. Hence the
  # same three settings that path needs: `$http_host` because a signature covers
  # the host including its port, and no body limit or buffering because a part
  # is up to 64 MiB. Nothing unsigned can write: anonymous holds Read only.
  location /files/ {
    proxy_pass http://s3:8333;
    proxy_set_header Host $http_host;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_hide_header Content-Disposition;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition $files_disposition always;
    add_header Content-Security-Policy $files_csp always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts always;
  }

  # Where an upload lands, and where an administrator's download is read from.
  # The store's own port is not published, so a browser using a presigned URL
  # comes through here — and the signature covers the Host header, which is why
  # it is passed on unchanged.
  #
  # Nothing is readable without a signature: the private bucket grants anonymous
  # nothing at all, and responds with 403 whether or not the object is there. A
  # signed GET is always saved (`$private_disposition`) and sandboxed, so no
  # address for an object exists without those headers.
  location /private/ {
    proxy_pass http://s3:8333;
    # `$http_host` rather than `$host`: the latter drops the port, and the port
    # is part of the host a presigned URL was signed for.
    proxy_set_header Host $http_host;
    # An upload is one part of up to 64 MiB. The default caps a body at 1 MB and
    # buffers it to disk first; neither is wanted here.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_hide_header Content-Disposition;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition $private_disposition always;
    add_header Content-Security-Policy "sandbox; default-src 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security $hsts always;
  }

  # The assistant's API, which the application hands on to a service that is not
  # published. **The default body limit is lifted here too, as it is for the
  # object store locations above**: an application arrives as a PDF, and the
  # default caps a body at 1 MB and buffers it to disk before the application
  # sees any of it. Reading one runs a language model over it, which is what the
  # timeouts are for.
  #
  # **300s rather than longer, because that is where the application gives up.**
  # Node's own client waits five minutes for a first byte and then reports the
  # service as unreachable, so a larger number here would only mean nginx
  # holding a connection the application has already let go of.
  location /admin/assistant/api/ {
    proxy_pass http://app:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # **The static half of the build is answered here**, from the directory the
  # proxy image has, and everything else goes to the application. A path
  # with no file behind it — every page, the API, and in development every
  # asset, because the development proxy has no build — falls through.
  #
  # Only `/assets/` is cached for long: those names have a hash of their
  # content, so a changed file is a new address. The rest of the directory
  # (the icons, `robots.txt`) keeps its name across releases, and the pages come
  # from the application, which sends no lifetime at all. `expires` rather than
  # `add_header`, so that the headers above are still inherited.
  location /assets/ {
    expires 1y;
    try_files $uri @app;
  }

  location / {
    try_files $uri @app;
  }

  location @app {
    proxy_pass http://app:5173;
    proxy_http_version 1.1;
    # `$http_host` rather than `$host`: the latter drops the port, and a form
    # post is refused when the `Origin` the browser sends does not match the
    # host the app believes it is responding on.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
